name: Publish new release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Select the release type
        required: true
        options:
          - patch
          - minor

jobs:
  ensure-changes:
    name: Ensure there are changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required to get all existing tags
          fetch-tags: true

      - name: Stop if there are no new changes
        run: |
          if ! LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "No tags found. Proceeding with the first release."
            exit 0
          fi
          LAST_COMMIT=$(git rev-parse HEAD)
          LASTEST_TAG_COMMIT=$(git rev-list -n 1 $LATEST_TAG)
          if [ "$LASTEST_TAG_COMMIT" == "$LAST_COMMIT" ]; then
            echo "No new changes since the last tag. Stopping the workflow."
            exit 1
          fi
          exit 0

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: ensure-changes
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version-file: package.json

      - name: Create new version
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version ${{ github.event.inputs.release-type }} -m "chore: v%s"

      - name: Package and create release
        run: |
          vp run build
          vp run package --linux --publish always --config.publish.owner="${{ github.repository_owner }}" --config.publish.repo="${{ github.event.repository.name }}"
        env:
          STEAM_API_KEYS: ${{ secrets.STEAM_API_KEYS }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: ensure-changes
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version-file: package.json

      - name: Create new version
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version ${{ github.event.inputs.release-type }} -m "chore: v%s"

      - name: Package and create release
        run: |
          vp run build
          vp run package --win --publish=always --config.publish.owner="${{ github.repository_owner }}" --config.publish.repo="${{ github.event.repository.name }}"
        env:
          STEAM_API_KEYS: ${{ secrets.STEAM_API_KEYS }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

  publish-on-github:
    name: Publish on GitHub
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version-file: package.json

      - name: Create new version
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version ${{ github.event.inputs.release-type }} -m "chore: v%s"

      - name: Push the tag to GitHub
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Publish release with installers
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tag = `v${version}`;
          const repository = process.env.GITHUB_REPOSITORY;
          const baseUrl = process.env.GITHUB_API_URL || 'https://api.github.com';
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2026-03-10',
          };
          async function api(path, options = {}) {
            const response = await fetch(`${baseUrl}/repos/${repository}${path}`, { ...options, headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            }
            return response.json();
          }

          let release;
          for (let page = 1; ; page++) {
            const releases = await api(`/releases?per_page=100&page=${page}`);
            release = releases.find((item) => item.tag_name === tag);
            if (release || releases.length < 100) break;
          }
          if (!release) throw new Error(`No uploaded release found for ${tag}`);

          const assets = [];
          for (let page = 1; ; page++) {
            const batch = await api(`/releases/${release.id}/assets?per_page=100&page=${page}`);
            assets.push(...batch);
            if (batch.length < 100) break;
          }
          const extensions = ['.exe', '.deb', '.rpm', '.AppImage'];
          const installers = extensions.map((extension) => {
            const asset = assets.find((item) =>
              item.name.includes(version) && item.name.endsWith(extension) &&
              item.state === 'uploaded' && item.size > 0);
            if (!asset) throw new Error(`Missing completed ${extension} installer for ${tag}`);
            return asset;
          });

          const published = await api(`/releases/${release.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ draft: false, prerelease: false, make_latest: 'true' }),
          });
          if (published.draft || published.prerelease) {
            throw new Error(`Release ${tag} was not published as a stable release`);
          }
          console.log(`Published ${published.html_url}`);
          const summary = [
            `## Release ${tag}`,
            `[Open GitHub Release](${published.html_url})`,
            ...installers.map((asset) => `- [${asset.name}](${asset.browser_download_url})`),
            '',
          ].join('\n');
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
